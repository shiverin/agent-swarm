name: Validate skill pipeline
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Behavioral tests
        run: python scripts/check_release.py
      - name: Fresh-start examples and verification
        run: |
          python scripts/swarm.py plan --brief assets/example-brief.json --out build/company
          python scripts/swarm.py verify --snapshot build/company
          python scripts/swarm.py compile --spec assets/example-lean-org.json --out build/lean
          python scripts/swarm.py verify --snapshot build/lean
          python scripts/swarm.py match --spec build/lean/org.json --agent builder
